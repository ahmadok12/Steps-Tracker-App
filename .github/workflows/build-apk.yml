name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          ROOT=$(dirname "$(find . -maxdepth 3 -name gradlew | head -1)")
          cd "$ROOT"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/TrueSteps.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: TrueSteps-apk
          path: TrueSteps.apk
